<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Even Or Odd Checker</title>
    <style>
      .main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 50px;
      }
      .h11 {
        color: blue;
        display: flex;
        justify-content: center;
      }
      .box {
        border: 2px solid black;
        border-radius: 20px;
        background-color: rgb(144, 192, 192);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: 40px;
        gap: 20px;
        height: 400px;
        width: 300px;
      }
      .p1 {
        color: green;
        font-size: large;
      }
      #userInput {
        border: none;
        background: transparent;
        font-size: large;
        border: red;
        border-radius: 20px;
        text-align: center;
      }
      #userInput1 {
        color: red;
        font-size: 25px;
      }
      #numb {
        color: red;
        background-color: yellow;
      }
      .btn {
        font-size: large;
        background-color: chartreuse;
        border-radius: 10px;
      }

      #res {
        color: red;
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <h1 class="h11"><b>Even Or Odd Number Program</b></h1>

      <div class="box">
        <label for="userInput" id="userInput1">Enter a number:</label>
        <input type="number" id="userInput" />
        <button class="btn" onclick="checkNumber()">Check</button>
        <p class="p1">Given Number: <span id="numb"></span></p>
        <p class="p1">Result: <span id="res"></span></p>
      </div>
    </div>

    <script>
      var name = prompt("Enter your name: ");
      console.log(alert(`Hello ${name}, Welcome to our Website`));
      function evenOrOdd(num) {
        if (num % 2 == 0) {
          return "Even Number";
        } else {
          return "Odd Number";
        }
      }
      function checkNumber() {
        let num = document.getElementById("userInput").value;
        document.getElementById("numb").textContent = num;
        document.getElementById("res").textContent = evenOrOdd(num);
      }
    </script>
  </body>
</html>
